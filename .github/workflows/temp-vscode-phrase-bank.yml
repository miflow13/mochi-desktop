name: Temporary VS Code phrase bank

on:
  push:
    branches:
      - feat/vscode-presence-category

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vscode-presence-category
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Add dedicated VS Code phrase pool
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          phrases_path = Path('src/mochi/presence/phrases.py')
          text = phrases_path.read_text()
          anchor = "        'version numbers are just birthdays',\n    ),\n    \"body_care\": (\n"
          if anchor not in text:
              raise SystemExit('developer phrase anchor not found')

          vscode_phrases = (
              'coding time 🌱',
              'ohhh, code',
              'what are we making?',
              'tiny code happening',
              'developer mode activated',
              'mochi sees code',
              'beep boop... probably',
              'this looks important',
              'very programmer',
              'look at all those brackets',
              'curly braces everywhere',
              'code code code',
              'something is brewing',
              'building little things',
              'making the computer do stuff',
              'tiny instructions for the machine',
              'pixels obeying commands',
              'wizard text',
              'computer spells',
              'writing machine magic',
              'mysterious symbols detected',
              'this seems computery',
              'serious keyboard business',
              'typing intensifies',
              'programmer noises',
              'hmm... code',
              'mochi is observing',
              "i'll supervise",
              'tiny coding assistant reporting in',
              'i brought moral support',
              "i'll watch the semicolons",
              "you type, i'll vibe",
              'code buddy online',
              "let's make something neat",
              'creating things again, huh?',
              'another day, another bracket',
              'the code cave',
              'welcome back, programmer',
              'the editor awaits',
              'time to poke the computer',
              'make the machine behave',
              'tell the computer what to do',
              'politely instructing silicon',
              'very technical. probably.',
              'i recognize some of these words',
              'developer habitat detected',
              'natural programmer environment',
              'code forest entered 🌱',
              'lots of little symbols in here',
              'ooo, syntax colors',
              'rainbow text means serious business',
              'everything looks very official',
              'i like the colorful words',
              'vs code spotted',
              'blue editor time',
              "we're in the code box",
              'the coding window!',
              'hello, tiny letters',
              'so many lines',
              'line numbers everywhere',
              'scrolling through the matrix',
              'code detected. commencing loaf.',
              'i shall guard the editor',
              'coding companion engaged',
              'mochi.exe is watching',
          )
          block = '    "vscode": (\n' + ''.join(f'        {phrase!r},\n' for phrase in vscode_phrases) + '    ),\n'
          text = text.replace(anchor, "        'version numbers are just birthdays',\n    ),\n" + block + '    "body_care": (\n', 1)
          phrases_path.write_text(text)

          engine_path = Path('src/mochi/presence/engine.py')
          text = engine_path.read_text()
          old = '''        if context.current_app_category == "vscode":\n            # VS Code is Mochi's strongest coding context. Keep the normal\n            # speech cadence, but make developer-flavored lines about 3x more\n            # likely than in a generic editor. A configured zero stays zero.\n            weights["developer"] = weights.get("developer", 0.0) * 3.0\n        elif context.current_app_category not in ("editor", "terminal"):\n            weights.pop("developer", None)\n'''
          new = '''        if context.current_app_category == "vscode":\n            # Keep VS Code's total coding-flavored weight at roughly 3x a\n            # generic editor, but reserve two thirds of that weight for lines\n            # that explicitly belong to Mochi's VS Code coworking context.\n            developer_weight = weights.get("developer", 0.0)\n            weights["vscode"] = developer_weight * 2.0\n        elif context.current_app_category not in ("editor", "terminal"):\n            weights.pop("developer", None)\n'''
          if old not in text:
              raise SystemExit('engine VS Code weighting anchor not found')
          engine_path.write_text(text.replace(old, new, 1))

          integration_path = Path('src/mochi/presence/integration.py')
          text = integration_path.read_text()
          old = '            "vscode": "developer",\n'
          new = '            "vscode": "vscode",\n'
          if old not in text:
              raise SystemExit('contextual preview mapping anchor not found')
          integration_path.write_text(text.replace(old, new, 1))

          tests_path = Path('tests/test_presence_engine.py')
          text = tests_path.read_text()
          old = '''def test_vscode_makes_developer_phrases_more_likely_than_generic_editor():\n    tuning = generous_tuning()\n    editor_engine = PresenceEngine(tuning=tuning, rng=random.Random(17), clock=Clock())\n    vscode_engine = PresenceEngine(tuning=generous_tuning(), rng=random.Random(17), clock=Clock())\n    editor = AmbientContext(current_app_category="editor", session_duration=10)\n    vscode = AmbientContext(current_app_category="vscode", session_duration=10)\n\n    editor_developer = sum(\n        editor_engine._select_unsolicited_category(editor) == "developer"\n        for _ in range(1000)\n    )\n    vscode_developer = sum(\n        vscode_engine._select_unsolicited_category(vscode) == "developer"\n        for _ in range(1000)\n    )\n\n    assert vscode_developer > editor_developer * 2\n'''
          new = '''def test_vscode_makes_coding_phrases_more_likely_than_generic_editor():\n    tuning = generous_tuning()\n    editor_engine = PresenceEngine(tuning=tuning, rng=random.Random(17), clock=Clock())\n    vscode_engine = PresenceEngine(tuning=generous_tuning(), rng=random.Random(17), clock=Clock())\n    editor = AmbientContext(current_app_category="editor", session_duration=10)\n    vscode = AmbientContext(current_app_category="vscode", session_duration=10)\n\n    editor_coding = sum(\n        editor_engine._select_unsolicited_category(editor) == "developer"\n        for _ in range(1000)\n    )\n    vscode_coding = sum(\n        vscode_engine._select_unsolicited_category(vscode) in {"developer", "vscode"}\n        for _ in range(1000)\n    )\n\n    assert vscode_coding > editor_coding * 2\n\n\ndef test_vscode_specific_phrases_only_participate_in_vscode_context():\n    editor_engine = PresenceEngine(tuning=generous_tuning(), rng=random.Random(5), clock=Clock())\n    vscode_engine = PresenceEngine(tuning=generous_tuning(), rng=random.Random(5), clock=Clock())\n    editor = AmbientContext(current_app_category="editor", session_duration=10)\n    vscode = AmbientContext(current_app_category="vscode", session_duration=10)\n\n    assert all(\n        editor_engine._select_unsolicited_category(editor) != "vscode"\n        for _ in range(500)\n    )\n    assert any(\n        vscode_engine._select_unsolicited_category(vscode) == "vscode"\n        for _ in range(500)\n    )\n    assert vscode_engine.phrases.choose("vscode")\n'''
          if old not in text:
              raise SystemExit('presence test anchor not found')
          tests_path.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused presence tests
        run: python -m pytest -q tests/test_presence_engine.py

      - name: Verify phrase pool
        run: |
          grep -q '"vscode": (' src/mochi/presence/phrases.py
          grep -q 'coding time 🌱' src/mochi/presence/phrases.py
          grep -q 'mochi.exe is watching' src/mochi/presence/phrases.py

      - name: Remove temporary workflow and commit phrases
        shell: bash
        run: |
          rm .github/workflows/temp-vscode-phrase-bank.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add VS Code coworking phrase bank"
          git push origin HEAD:feat/vscode-presence-category
