name: Temporary VS Code coworking mode

on:
  push:
    branches:
      - feat/vscode-presence-category

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vscode-presence-category
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Apply coworking patch from staged workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/temp-vscode-coworking-mode.yml"],
              text=True,
          ).splitlines()
          start = old.index("          python - <<'PY'")
          end = next(
              i for i in range(start + 1, len(old))
              if old[i] == "          PY"
          )
          script = "\n".join(line[10:] for line in old[start:end + 1]) + "\n"
          Path("/tmp/apply-coworking.sh").write_text(script)
          subprocess.run(["bash", "/tmp/apply-coworking.sh"], check=True)
          PY

      - name: Compile changed modules
        run: python -m py_compile src/mochi/presence/integration.py src/mochi/presence/music_dance.py

      - name: Run supported focused regressions
        run: python -m pytest -q tests/test_presence_engine.py tests/test_music_activity.py tests/test_media_activity.py

      - name: Verify coworking wiring
        run: |
          grep -q 'VSCODE_COWORK_DEBOUNCE_MS = 700' src/mochi/presence/integration.py
          grep -q '_maybe_resume_vscode_coworking' src/mochi/presence/music_dance.py
          grep -q 'VS Code coworking mode started' src/mochi/presence/integration.py

      - name: Remove temporary workflow and commit feature
        shell: bash
        run: |
          rm .github/workflows/temp-vscode-coworking-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: cowork with user while VS Code is focused"
          git push origin HEAD:feat/vscode-presence-category
