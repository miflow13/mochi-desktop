name: Temporary YouTube signal cleanup

on:
  push:
    branches:
      - feat/vscode-presence-category

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vscode-presence-category
          fetch-depth: 0

      - name: Stop repeated YouTube focus heartbeat signals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('gnome-extension/mochi-typing@miflow13/extension.js')
          text = path.read_text()
          old = '                this._updateYouTubeFocusedState(true);'
          new = '                this._updateYouTubeFocusedState(false);'
          if old not in text:
              raise SystemExit('expected YouTube heartbeat call was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/temp-youtube-signal-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: emit YouTube focus only on state changes"
          git push origin HEAD:feat/vscode-presence-category
