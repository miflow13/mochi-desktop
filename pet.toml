# Mochi — Deskling Pet Format v1
#
# This manifest intentionally maps only behavior that Deskling v0.1 can
# represent faithfully today. Mochi's original application remains the source
# for richer contextual behavior such as typing, music, care, and app-aware
# reactions.

schema_version = 1

