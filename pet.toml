[interaction]
click_animation = "squish"
double_click_animation = "heart"

[transitions]
idle = ["reaction", "walking", "dragging"]
reaction = ["idle", "walking", "dragging"]
walking = ["idle", "reaction", "dragging"]
dragging = ["idle"]

[behavior.idle]
min_delay_ms = 5000
max_delay_ms = 14000
actions = [
  { name = "blink", weight = 5.0 },
  { name = "look", weight = 2.0 },
  { name = "bounce", weight = 1.0 },
]

[behavior.roam]
min_delay_ms = 7000
max_delay_ms = 16000
min_walk_ms = 900
max_walk_ms = 2400
speed_px_s = 80.0
left_animation = "walk_left"
right_animation = "walk"
