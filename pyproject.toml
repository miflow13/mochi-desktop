[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi-desktop"
version = "0.1.0"
description = "A tiny friend for your Linux desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mochi contributors" }]
dependencies = []

[project.scripts]
mochi = "mochi.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/mochi" = ["assets/mochi/mochi-sprites.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
