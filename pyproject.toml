[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi-desktop"
version = "0.2.0a0"
description = "A tiny friend for your Linux desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mochi contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["Pillow>=10"]

[project.scripts]
mochi = "mochi.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/mochi/audio" = ["assets/audio/*"]
"share/mochi" = ["assets/mochi/manifest.json"]
"share/mochi/idle" = ["assets/mochi/idle/*.png"]
"share/mochi/squish" = ["assets/mochi/squish/*.png"]
"share/mochi/drag" = ["assets/mochi/drag/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
