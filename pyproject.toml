[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi-desktop"
version = "0.1.0"
description = "A tiny friend for your Linux desktop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mochi contributors" }]
dependencies = []

[project.scripts]
mochi = "mochi.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/mochi/audio" = ["assets/audio/*"]
"share/mochi" = ["assets/mochi/manifest.json"]
"share/mochi/master" = ["assets/mochi/master/*.png"]
"share/mochi/idle" = ["assets/mochi/idle/*.png"]
"share/mochi/blink" = ["assets/mochi/blink/*.png"]
"share/mochi/dragged" = ["assets/mochi/dragged/*.png"]
"share/mochi/drag" = ["assets/mochi/drag/*.png"]
"share/mochi/pickup" = ["assets/mochi/pickup/*.png"]
"share/mochi/walk" = ["assets/mochi/walk/*.png"]
"share/mochi/walk_left" = ["assets/mochi/walk_left/*.png"]
"share/mochi/bounce" = ["assets/mochi/bounce/*.png"]
"share/mochi/squish" = ["assets/mochi/squish/*.png"]
"share/mochi/sleep_transition" = ["assets/mochi/sleep_transition/*.png"]
"share/mochi/sleeping" = ["assets/mochi/sleeping/*.png"]
"share/mochi/wake" = ["assets/mochi/wake/*.png"]
"share/mochi/heart" = ["assets/mochi/heart/*.png"]
"share/mochi/computer" = ["assets/mochi/computer/*.png"]
"share/mochi/typing" = ["assets/mochi/typing/*.png"]
"share/mochi/typing_intro" = ["assets/mochi/typing_intro/*.png"]
"share/mochi/typing_outro" = ["assets/mochi/typing_outro/*.png"]
"share/mochi/watch" = ["assets/mochi/watch/*.png"]
"share/mochi/dance" = ["assets/mochi/dance/*.png"]
"share/mochi/searching" = ["assets/mochi/searching/*.png"]
"share/mochi/sway_idle" = ["assets/mochi/sway_idle/*.png"]
"share/mochi/drop" = ["assets/mochi/drop/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
